<template>
    <!-- Erreur -->
    <template if:true={error}>
        <lightning-card>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_error">{errorMessage}</p>
            </div>
        </lightning-card>
    </template>

    <!-- Chargement -->
    <template if:false={isLoaded}>
        <lightning-card>
            <div class="slds-align_absolute-center slds-p-around_medium">
                <lightning-spinner alternative-text="Chargement..." size="small"></lightning-spinner>
            </div>
        </lightning-card>
    </template>

    <!-- Composant principal -->
    <template if:true={isLoaded}>
        <lightning-card>
            <div class="compact-wrapper">

                <!-- En-tête : icône + numéro sinistre -->
                <template if:true={nameItem}>
                    <div class="compact-header slds-media slds-media_center">
                        <div class="slds-media__figure slds-media__figure_fixed-width slds-align_absolute-center">
                            <lightning-icon
                                icon-name="standard:case"
                                size="medium"
                                alternative-text="Sinistre">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body slds-truncate">
                            <p class="label-title">{nameItem.label}</p>
                            <h1 class="claim-number slds-truncate">{nameItem.value}</h1>
                        </div>
                    </div>
                    <div class="compact-divider"></div>
                </template>

                <!-- Champs du Field Set -->
                <div class="compact-fields">
                    <template for:each={fieldItems} for:item="field">
                        <div key={field.fieldPath} class="field-block">

                            <p class="field-label" title={field.label}>{field.label}</p>

                            <!-- 1. Lookup (REFERENCE) -->
                            <template if:true={field.isReference}>
                                <template if:true={field.referenceId}>
                                    <a href={field.recordUrl}
                                       class="field-link slds-truncate"
                                       title={field.displayValue}>
                                        {field.displayValue}
                                    </a>
                                </template>
                                <template if:false={field.referenceId}>
                                    <span class="field-value field-empty">—</span>
                                </template>
                            </template>

                            <!-- 2. Formula HTML link (ex: RegistrationNumber__c, PolicyNumber__c) -->
                            <template if:true={field.isFormulaLink}>
                                <template if:true={field.referenceId}>
                                    <a href={field.recordUrl}
                                       class="field-link slds-truncate"
                                       title={field.displayValue}>
                                        {field.displayValue}
                                    </a>
                                </template>
                                <template if:false={field.referenceId}>
                                    <span class="field-value field-empty">—</span>
                                </template>
                            </template>

                            <!-- 3. Date / DateTime -->
                            <template if:true={field.isDateTime}>
                                <template if:true={field.value}>
                                    <lightning-formatted-date-time
                                        value={field.value}
                                        year="numeric"
                                        month="numeric"
                                        day="numeric"
                                        hour="numeric"
                                        minute="2-digit"
                                        class="field-value">
                                    </lightning-formatted-date-time>
                                </template>
                                <template if:false={field.value}>
                                    <span class="field-value field-empty">—</span>
                                </template>
                            </template>

                            <!-- 4. Texte / Formule simple / Picklist -->
                            <template if:true={field.isText}>
                                <template if:true={field.value}>
                                    <span class="field-value slds-truncate" title={field.value}>{field.value}</span>
                                </template>
                                <template if:false={field.value}>
                                    <span class="field-value field-empty">—</span>
                                </template>
                            </template>

                        </div>
                    </template>
                </div>

            </div>
        </lightning-card>
    </template>
</template>
