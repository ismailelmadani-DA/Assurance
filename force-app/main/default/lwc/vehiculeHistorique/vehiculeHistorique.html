<template>
    <div class="pm-card">

        <!-- ══ HEADER ══ -->
        <div class="pm-header">
            <div class="pm-header__left">
                <div class="pm-header__icon-wrap">
                    <lightning-icon icon-name="utility:truck" alternative-text="Véhicule" size="small"></lightning-icon>
                </div>
                <div>
                    <h2 class="pm-header__title">Historique des véhicules</h2>
                    <span class="pm-header__subtitle">Véhicules associés au passager</span>
                </div>
            </div>
            <div class="pm-header__actions">
                <div class="pm-filter-pills">
                    <button class={pillAll}       onclick={filterAll}>Tous</button>
                    <button class={pillDriver}    onclick={filterDriver}>Conducteur</button>
                    <button class={pillPassenger} onclick={filterPassenger}>Passager</button>
                </div>
            </div>
        </div>

        <!-- ══ BODY ══ -->
        <div class="pm-body">

            <!-- Spinner -->
            <template if:true={isLoading}>
                <div class="pm-spinner-overlay">
                    <lightning-spinner
                        alternative-text="Chargement..."
                        size="medium"
                        variant="brand">
                    </lightning-spinner>
                </div>
            </template>

            <!-- Erreur -->
            <template if:true={hasError}>
                <div class="pm-alert pm-alert--error">
                    <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    Une erreur est survenue lors du chargement des véhicules.
                </div>
            </template>

            <!-- Tableau -->
            <template if:true={hasData}>
                <div class="pm-table-wrap">
                    <table class="pm-table">
                        <thead>
                            <tr>
                                <th class="pm-th">N° Immatriculation</th>
                                <th class="pm-th">Marque et modèle</th>
                                <th class="pm-th">Propriétaire du véhicule</th>
                                <th class="pm-th pm-th--center">Conducteur</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={pagedVehicles} for:item="row">
                                <tr key={row.vehicleId}>

                                    <!-- N° Immatriculation -->
                                    <td class="pm-td pm-td--mono">
                                        <button
                                            class="pm-link"
                                            data-id={row.vehicleId}
                                            onclick={handleNavigate}>
                                            {row.registrationNumber}
                                        </button>
                                    </td>

                                    <!-- Marque et modèle -->
                                    <td class="pm-td">{row.brandModel}</td>

                                    <!-- Propriétaire -->
                                    <td class="pm-td">
                                        <template if:true={row.ownerId}>
                                            <button
                                                class="pm-link"
                                                data-id={row.ownerId}
                                                onclick={handleNavigateOwner}>
                                                {row.ownerName}
                                            </button>
                                        </template>
                                        <template if:false={row.ownerId}>
                                            {row.ownerName}
                                        </template>
                                    </td>

                                    <!-- Conducteur -->
                                    <td class="pm-td pm-td--center">
                                        <span class={row.driverBadgeClass}>{row.driverLabel}</span>
                                    </td>

                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pm-pagination">
                    <button class="pm-btn pm-btn--page" disabled={isPrevDisabled} onclick={prevPage}>‹ Préc.</button>
                    <span class="pm-page-info">{pageLabel}</span>
                    <button class="pm-btn pm-btn--page" disabled={isNextDisabled} onclick={nextPage}>Suiv. ›</button>
                </div>
            </template>

            <!-- État vide -->
            <template if:true={isEmpty}>
                <div class="pm-empty">
                    <div class="pm-empty__icon">
                        <lightning-icon icon-name="standard:vehicle" size="large"></lightning-icon>
                    </div>
                    <p class="pm-empty__text">Aucun véhicule trouvé pour ce passager.</p>
                </div>
            </template>

        </div>
    </div>
</template>
