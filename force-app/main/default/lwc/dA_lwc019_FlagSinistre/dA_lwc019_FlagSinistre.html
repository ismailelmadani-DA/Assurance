<template>
   <div class="fs-actions-row">
    <button class="fs-btn fs-btn--add fs-btn--fixed" onclick={handleOpenModal}>
        <lightning-icon icon-name="utility:flag" size="xx-small"></lightning-icon>
        Flagger Sinistre
    </button>

    <template if:true={isEvenementVisible}>
        <button class="fs-btn fs-btn--add fs-btn--event fs-btn--fixed" onclick={openEvenementPopup}>
            
            <template if:true={evenementAssocie}>Modifier l'événement</template>
            <template if:false={evenementAssocie}>Ajouter événement</template>
        </button>
    </template>
</div>

    <!-- ═══ MODAL FLAG ═══ -->
    <template if:true={isModalOpen}>
        <div class="fs-modal-overlay">
            <div class="fs-modal">
                <div class="fs-modal__header">
                    <div class="fs-modal__header-inner">
                        <lightning-icon icon-name="utility:flag" size="small"></lightning-icon>
                        <h2 class="fs-modal__title">Flagger le Sinistre</h2>
                    </div>
                    <button class="fs-modal__close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="xx-small" variant="inverse"></lightning-icon>
                    </button>
                </div>
                <div class="fs-modal__body">
                    <div class="fs-section">
                        <div class="fs-section__title">
                            <span class="fs-section__num">1</span>
                            Sélectionnez les flags
                        </div>
                        <div class="fs-section__content">
                            <template for:each={flagOptions} for:item="opt">
                                <div key={opt.value} class="fs-checkbox-item" data-flag={opt.value} onclick={handleDisabledClick}>
                                    <lightning-input
                                        type="checkbox"
                                        label={opt.label}
                                        checked={opt.checked}
                                        disabled={opt.disabled}
                                        data-flag={opt.value}
                                        onchange={handleFlagChange}>
                                    </lightning-input>
                                    <template if:true={opt.pendingLabel}>
                                        <span class="fs-pending-tag">{opt.pendingLabel}</span>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="fs-section">
                        <div class="fs-section__title">
                            <span class="fs-section__num">2</span>
                            Commentaire
                        </div>
                        <div class="fs-section__content">
                            <lightning-textarea
                                label="Commentaire"
                                value={commentaire}
                                onchange={handleCommentChange}
                                required
                                placeholder="Saisissez un commentaire...">
                            </lightning-textarea>
                        </div>
                    </div>
                </div>
                <div class="fs-modal__footer">
                    <button class="fs-btn fs-btn--cancel" onclick={handleCloseModal}>Annuler</button>
                    <button class="fs-btn fs-btn--save" onclick={handleConfirm} disabled={isSaving}>Confirmer</button>
                </div>
            </div>
        </div>
    </template>

    <!-- ═══ MODAL ÉVÉNEMENT ═══ -->
    <template if:true={showEvenementPopup}>
        <div class="sep-overlay" onclick={handleEvenementOverlayClick}>
            <section class="sep-modal" onclick={stopPropagation}>

                <header class="sep-modal__header">
    <div class="sep-modal__header-inner">
        <div class="sep-modal__icon">
            <lightning-icon icon-name="utility:event" size="small" variant="inverse"></lightning-icon>
        </div>
        <div>
            <!-- ✅ Titre dynamique -->
            <h2 class="sep-modal__title">{popupTitre}</h2>
            <p class="sep-modal__subtitle">
                {popupSousTitre}
                <template if:true={hasMatchingEvents}>
                    &nbsp;·&nbsp;
                    <strong>{matchingEvenementsCount}</strong> trouvé(s)
                </template>
            </p>
        </div>
    </div>
    <button class="sep-modal__close" onclick={closeEvenementPopup} title="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" style="width:14px;height:14px;">
            <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
    </button>
</header>

                <div class="sep-modal__body">
                    <template if:true={isEvenementLoading}>
                        <div class="sep-loading">
                            <lightning-spinner alternative-text="Chargement" size="medium"></lightning-spinner>
                            <p>Recherche des événements correspondants...</p>
                        </div>
                    </template>

                    <template if:false={isEvenementLoading}>
                        <template if:true={hasMatchingEvents}>
                            <div class="sep-event-list">
                                <template for:each={matchingEvenements} for:item="ev">
                                    <div key={ev.Id}
                                         class={ev.rowClass}
                                         onclick={handleSelectEvent}
                                         data-id={ev.Id}>
                                        <div class="sep-event-row__radio">
                                            <div class={ev.radioClass}>
                                                <template if:true={ev.isSelected}>
                                                    <div class="sep-radio__dot"></div>
                                                </template>
                                            </div>
                                        </div>
                                        <div class="sep-event-row__content">
                                            <span class="sep-event-row__name">{ev.Libelle__c}</span>
                                            <span class="sep-event-row__code">{ev.Name}</span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template if:false={hasMatchingEvents}>
                            <div class="sep-empty-popup">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.5" class="sep-empty-popup__icon">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="8" x2="12" y2="12"/>
                                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                                <p class="sep-empty-popup__title">Aucun événement correspondant</p>
                                <p class="sep-empty-popup__sub">
                                    Aucun événement ne correspond à la date de survenance
                                    et à la localisation de ce sinistre.
                                </p>
                            </div>
                        </template>
                    </template>
                </div>

                <footer class="sep-modal__footer">
                    <button class="sep-btn sep-btn--cancel" onclick={closeEvenementPopup}>Annuler</button>
                    <button class="sep-btn sep-btn--confirm"
                            onclick={handleEvenementConfirm}
                            disabled={isEvenementConfirmDisabled}>
                        <template if:true={isEvenementSaving}>
                            <lightning-spinner alternative-text="Sauvegarde" size="x-small" variant="inverse"></lightning-spinner>
                        </template>
                        Confirmer
                    </button>
                </footer>

            </section>
        </div>
    </template>

</template>
