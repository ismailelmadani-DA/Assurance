<template>

    <template lwc:if={hasError}>
        <lightning-card>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_error">{errorMessage}</p>
            </div>
        </lightning-card>
    </template>

    <template lwc:elseif={isLoading}>
        <lightning-spinner alternative-text="Chargement..." size="small"></lightning-spinner>
    </template>

    <template lwc:elseif={isLoaded}>
        <div class="slds-page-header ccl-container">

            <!-- ── Header : icône + titre + actions ── -->
            <div class="slds-page-header__row ccl-header-row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media" style="align-items: center;">
                        <div class="slds-media__figure ccl-icon-wrap">
                            <lightning-icon icon-name={iconName} size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p class="ccl-record-type">{displayTitle}</p>
                            <h1 class="ccl-title slds-truncate">{caseNumber}</h1>
                        </div>
                    </div>
                </div>

                <div class="slds-page-header__col-actions ccl-actions">
                    <!-- Badge demande en cours -->
                    <template lwc:if={hasRequeteInitiale}>
                        <div class="ccl-badge-reaffectation">
                            <span>Demande de réaffectation en cours</span>
                        </div>
                    </template>

                    <template for:each={actionItems} for:item="btn">
                        <div key={btn.name} class="ccl-action-btn">
                            <lightning-button
                                data-name={btn.name}
                                label={btn.label}
                                variant={btn.variant}
                                onclick={handleAction}>
                            </lightning-button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ── Champs ── -->
            <div class="slds-page-header__row ccl-fields-row">
                <div class="slds-page-header__col-details">
                    <ul class="ccl-fields-grid">
                        <template for:each={fieldItems} for:item="field">
                            <li key={field.fieldPath} class="ccl-field-item">

                                <p class="ccl-field-label slds-truncate">{field.label}</p>

                                <!-- Status → badge pill -->
                                <template lwc:if={field.isStatus}>
                                    <span class={field.statusClass}>
                                        <span class="ccl-status-dot"></span>
                                        {field.displayValue}
                                    </span>
                                </template>

                                <!-- DateTime -->
                                <template lwc:elseif={field.isDateTime}>
                                    <template lwc:if={field.displayValue}>
                                        <lightning-formatted-date-time
                                            value={field.displayValue}
                                            year="numeric"
                                            month="numeric"
                                            day="numeric"
                                            hour="2-digit"
                                            minute="2-digit"
                                            time-zone="Africa/Casablanca"
                                            class="ccl-field-value">
                                        </lightning-formatted-date-time>
                                    </template>
                                    <template lwc:else>
                                        <span class="ccl-field-empty">—</span>
                                    </template>
                                </template>

                                <!-- Lookup cliquable -->
                                <template lwc:elseif={field.isLookup}>
                                    <template lwc:if={field.lookupId}>
                                        <a data-id={field.lookupId}
                                           href={field.recordUrl}
                                           onclick={navigateToRecord}
                                           class="slds-truncate ccl-link">
                                            {field.displayValue}
                                        </a>
                                    </template>
                                    <template lwc:else>
                                        <span class="ccl-field-empty">—</span>
                                    </template>
                                </template>

                                <!-- Texte standard -->
                                <template lwc:else>
                                    <template lwc:if={field.displayValue}>
                                        <p class="slds-truncate ccl-field-value">{field.displayValue}</p>
                                    </template>
                                    <template lwc:else>
                                        <span class="ccl-field-empty">—</span>
                                    </template>
                                </template>

                            </li>
                        </template>
                    </ul>
                </div>
            </div>

        </div>
    </template>

    <c-d-a_lwc026_-reaffecter-declaration
        lwc:ref="reassignModal"
        record-id={recordId}>
    </c-d-a_lwc026_-reaffecter-declaration>

    <c-d-a_lwc027_-valider-reaffectation
        lwc:ref="validateReassignModal"
        record-id={recordId}
        onownerresolved={handleOwnerResolved}>
    </c-d-a_lwc027_-valider-reaffectation>

    <c-d-a_lwc028_-rejeter-reaffectation
        lwc:ref="rejectReassignModal"
        record-id={recordId}
        onownerresolved={handleRejectOwnerResolved}>
    </c-d-a_lwc028_-rejeter-reaffectation>

</template>
