<template>

    <template lwc:if={hasError}>
        <lightning-card>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_error">{errorMessage}</p>
            </div>
        </lightning-card>
    </template>

    <template lwc:elseif={isLoading}>
        <lightning-spinner alternative-text="Chargement..." size="small"></lightning-spinner>
    </template>

    <template lwc:elseif={isLoaded}>
        <div class="slds-page-header ccl-container">

            <!-- ── Titre + actions ── -->
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name={iconName} size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-page-header__name-title ccl-record-type">{displayTitle}</p>
                            <h1 class="slds-page-header__title slds-truncate">{caseNumber}</h1>
                        </div>
                    </div>
                </div>

                <div class="slds-page-header__col-actions ccl-actions">
                    <template for:each={actionItems} for:item="btn">
                        <lightning-button
                            key={btn.name}
                            data-name={btn.name}
                            label={btn.label}
                            variant={btn.variant}
                            icon-name={btn.iconName}
                            onclick={handleAction}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </template>
                </div>
            </div>

            <!-- ── Champs ── -->
            <div class="slds-page-header__row slds-m-top_small">
                <div class="slds-page-header__col-details">
                    <ul class="slds-grid slds-wrap">

                        <template for:each={fieldItems} for:item="field">
                            <li key={field.fieldPath}
                                class="slds-col slds-size_1-of-3 slds-p-right_medium slds-m-bottom_x-small">

                                <p class="slds-text-title slds-truncate ccl-field-label">{field.label}</p>

                                <!-- DateTime -->
                                <template lwc:if={field.isDateTime}>
                                    <template lwc:if={field.displayValue}>
                                        <lightning-formatted-date-time
                                            value={field.displayValue}
                                            year="numeric"
                                            month="numeric"
                                            day="numeric"
                                            hour="2-digit"
                                            minute="2-digit"
                                            time-zone="Africa/Casablanca">
                                        </lightning-formatted-date-time>
                                    </template>
                                    <template lwc:else>
                                        <span class="slds-text-color_weak">—</span>
                                    </template>
                                </template>

                                <!-- Lookup cliquable -->
                                <template lwc:elseif={field.isLookup}>
                                    <template lwc:if={field.lookupId}>
                                        <a data-id={field.lookupId}
                                           href={field.recordUrl}
                                           onclick={navigateToRecord}
                                           class="slds-truncate ccl-link">
                                            {field.displayValue}
                                        </a>
                                    </template>
                                    <template lwc:else>
                                        <span class="slds-text-color_weak">—</span>
                                    </template>
                                </template>

                                <!-- Texte standard -->
                                <template lwc:else>
                                    <template lwc:if={field.displayValue}>
                                        <p class="slds-truncate ccl-field-value">{field.displayValue}</p>
                                    </template>
                                    <template lwc:else>
                                        <span class="slds-text-color_weak">—</span>
                                    </template>
                                </template>

                            </li>
                        </template>

                    </ul>
                </div>
            </div>

        </div>
    </template>

</template>
