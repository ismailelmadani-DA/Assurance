<template>
    <div class="recap-container">
        <div class="slds-notify slds-notify_alert slds-alert_info slds-m-bottom_medium slds-theme_info">
            <lightning-icon icon-name="utility:info" size="small" variant="inverse" class="slds-m-right_small"></lightning-icon>
            <h2>Veuillez vérifier les informations ci-dessous avant de clôturer définitivement le dossier.</h2>
        </div>

        <div class="slds-grid slds-wrap slds-gutters">
            
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                <div class="recap-card">
                    <h3 class="recap-header">
                        <lightning-icon icon-name="standard:contract" size="small" class="slds-m-right_small"></lightning-icon>
                        Police & Déclaration
                    </h3>
                    <div class="recap-content">
                        <p><strong>N° Déclaration :</strong> <span class="badge-success">{caseNumber}</span></p>
                        <p><strong>N° Police :</strong> {policy.PolicyNumber}</p>
                        <p><strong>Véhicule Assuré :</strong> {policy.RegistrationNumber} ({policy.Brand})</p>
                        <div class="divider"></div>
                        <p><strong>Date de l'accident :</strong> {dateSurvenance}</p>
                        <p><strong>Lieu :</strong> {caseData.city}, {caseData.country}</p>
                    </div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                <div class="recap-card">
                    <h3 class="recap-header">
                        <lightning-icon icon-name="standard:driver" size="small" class="slds-m-right_small"></lightning-icon>
                        Conducteur & Assurés
                    </h3>
                    <div class="recap-content">
                        <p><strong>Conducteur :</strong> {driver.FirstName} {driver.LastName}</p>
                        <p><strong>N° Permis :</strong> {driver.LicenseNumber__c}</p>
                        <p><strong>Date de délivrance :</strong> {driver.LicenseDate__c}</p>
                        <div class="divider"></div>
                        <p><strong>Passagers assurés impliqués :</strong> <span class="badge-info">{passengersCount}</span></p>
                    </div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                <div class="recap-card">
                    <h3 class="recap-header">
                        <lightning-icon icon-name="standard:service_vehicle" size="small" class="slds-m-right_small"></lightning-icon>
                        Véhicule(s) Adverse(s)
                    </h3>
                    <div class="recap-content">
                        <template if:true={hasAdverseVehicles}>
                            <template for:each={adverseVehicles} for:item="adv">
                                <div key={adv.key} class="recap-item slds-m-bottom_small">
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small slds-grid slds-grid_align-spread">
                                            <div><strong>{adv.RegistrationNumber__c} - {adv.Marque__c}</strong></div>
                                            <div><span class="badge-warning">{adv.NbDePassagerBlesses__c} blessé(s)</span></div>
                                        </div>
                                        
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-body_small">
                                            <p class="slds-m-bottom_xx-small"><strong>Type :</strong> {adv.TypeVehicule__c}</p>
                                            <p class="slds-m-bottom_xx-small"><strong>Contrat :</strong> {adv.Numéro_de_contrat__c}</p>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-body_small">
                                            <p class="slds-m-bottom_xx-small"><strong>État :</strong> {adv.VehicleIsDamaged__c}</p>
                                            <p class="slds-m-bottom_xx-small"><strong>Adversaire assuré :</strong> 
                                                <template if:true={adv.Adversaire_Assure__c}>Oui</template>
                                                <template if:false={adv.Adversaire_Assure__c}>Non</template>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasAdverseVehicles}>
                            <p class="empty-state">Aucun véhicule adverse déclaré.</p>
                        </template>
                    </div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                <div class="recap-card">
                    <h3 class="recap-header">
                        <lightning-icon icon-name="standard:people" size="small" class="slds-m-right_small"></lightning-icon>
                        Autres Parties & Dommages
                    </h3>
                    <div class="recap-content">
                        <template if:true={hasOtherParties}>
                            <template for:each={otherParties} for:item="party">
                                <div key={party.key} class="recap-item slds-m-bottom_small">
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_small slds-grid slds-grid_align-spread">
                                            <div><strong>{party.Prenom__c} {party.Nom__c}</strong></div>
                                            <div><span class="slds-badge slds-m-left_x-small">{party.OpposingParty__c}</span></div>
                                        </div>
                                        
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-body_small">
                                            <p class="slds-m-bottom_xx-small"><strong>CIN :</strong> {party.CIN__c}</p>
                                            <p class="slds-m-bottom_xx-small"><strong>Ville :</strong> {party.Ville__c}</p>
                                            <p class="slds-m-bottom_xx-small"><strong>Adresse :</strong> {party.Adresse__c}</p>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-text-body_small">
                                            <p class="slds-m-bottom_xx-small"><strong>État corporel :</strong> {party.StateOfPerson__c}</p>
                                            <p class="slds-m-bottom_xx-small"><strong>Téléphone :</strong> {party.Telephone__c}</p>
                                            <p class="slds-m-bottom_xx-small"><strong>Email :</strong> {party.Email__c}</p>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasOtherParties}>
                            <p class="empty-state">Aucune autre partie déclarée.</p>
                        </template>
                    </div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                <div class="recap-card">
                    <h3 class="recap-header">
                        <lightning-icon icon-name="standard:entitlement" size="small" class="slds-m-right_small"></lightning-icon>
                        Garanties s&eacute;lectionn&eacute;es
                    </h3>
                    <div class="recap-content">
                        <template if:true={hasCoverages}>
                            <table class="garantie-table">
                                <thead>
                                    <tr>
                                        <th>Code</th>
                                        <th>Nom de la garantie</th>
                                        <th>Type</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={coverages} for:item="cov">
                                        <tr key={cov.key}>
                                            <td>{cov.code}</td>
                                            <td>{cov.name}</td>
                                            <td>{cov.type}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasCoverages}>
                            <p class="empty-state">Aucune garantie s&eacute;lectionn&eacute;e.</p>
                        </template>
                    </div>
                </div>
            </div>

        </div>
    </div>
</template>
