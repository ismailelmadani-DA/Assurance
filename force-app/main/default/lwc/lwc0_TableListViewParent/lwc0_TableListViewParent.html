<template>
    <div class="dynamic-card">

        <template if:true={isLoading}>
            <div class="dynamic-spinner-overlay">
                <lightning-spinner alternative-text="Chargement" size="medium"></lightning-spinner>
            </div>
        </template>

        <div class="dynamic-header">
            <div class="dynamic-header__left">
                <div class="dynamic-header__icon-wrap">
                    <template if:true={selectedSObject}>
                        <lightning-icon icon-name={objectLogo} alternative-text="Object Icon" size="small" variant="inverse"></lightning-icon>
                    </template>
                    <template if:false={selectedSObject}>
                        <lightning-icon icon-name="standard:list" alternative-text="Liste" size="small" variant="inverse"></lightning-icon>
                    </template>
                </div>

                <div>
                    <h2 class="dynamic-header__title">
                        <template if:true={selectedSObject}>{selectedSObject}</template>
                        <template if:false={selectedSObject}>Liste de vues dynamique</template>
                    </h2>

                    <span class="dynamic-header__subtitle">
                        <template if:true={totalRecords}>{totalRecords} enregistrement(s)</template>
                        <template if:false={totalRecords}>Gestion dynamique des vues</template>
                    </span>
                </div>
            </div>

            <div class="dynamic-header__actions">
                <button class="dynamic-refresh-btn" onclick={refreshWithFeedback} disabled={isLoading} title="Actualiser">
                    <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                </button>

                <template if:true={showExport}>
                    <button class="dynamic-action-btn" onclick={exportToCSV} disabled={isLoading} title="Exporter">
                        <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                        Exporter
                    </button>
                </template>
            </div>
        </div>

        <div class="dynamic-body">

            <div class="dynamic-filter-section">
                <div class="slds-grid slds-grid_align-spread slds-p-bottom_small">
                    <div class="slds-col">
                        <h3 class="dynamic-section-title">Filtres et options</h3>
                    </div>
                </div>

                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-vertical_x-small">
                        <label for="object-select" class="slds-form-element__label">Menu</label>
                        <lightning-combobox id="object-select" name="object" value={selectedSObject}
                            options={sObjectOptions} onchange={handleSObjectChange}
                            disabled={disableSObjectSelection} variant="label-hidden"
                            class="custom-combobox">
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-vertical_x-small">
                        <label for="view-select" class="slds-form-element__label">Liste</label>
                        <lightning-combobox id="view-select" name="view" value={selectedListView}
                            options={listViewOptions} onchange={handleListViewChange}
                            disabled={disableListViewSelection} variant="label-hidden"
                            class="custom-combobox">
                        </lightning-combobox>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-vertical_x-small">
                        <label for="search-input" class="slds-form-element__label">Rechercher</label>
                        <lightning-input id="search-input" type="search"
                            placeholder="Rechercher dans tous les enregistrements..."
                            value={searchTerm} onchange={handleSearchChange}
                            disabled={disableSearch} variant="label-hidden"
                            class="custom-search">
                        </lightning-input>
                    </div>
                </div>
            </div>

            <template if:true={filteredData.length}>
                <div class="dynamic-stats-bar">
                    <span>
                        <template if:true={searchTerm}>
                            {totalRecords} résultat(s) de recherche
                        </template>
                        <template if:false={searchTerm}>
                            {totalRecords} enregistrement(s)
                        </template>
                    </span>

                    <span class="dynamic-update-info">
                        <template if:true={isLoading}>Recherche en cours...</template>
                        <template if:false={isLoading}>Dernière mise à jour : à l'instant</template>
                    </span>
                </div>
            </template>

            <template if:false={isLoading}>
                <div class="dynamic-data-container">
                    <template if:true={filteredData.length}>
                        <div class="dynamic-table-wrap">
                            <table class="dynamic-table" role="grid">
                                <thead>
                                    <tr>
                                        <template for:each={columns} for:item="column">
                                            <th key={column.fieldName} class="dynamic-th"
                                                onclick={handleColumnClick} data-field={column.fieldName}>
                                                <span title={column.label}>{column.label}</span>

                                                <template if:true={column.isSorted}>
                                                    <lightning-icon icon-name={column.sortIconName} size="xx-small"
                                                        class="slds-m-left_x-small">
                                                    </lightning-icon>
                                                </template>
                                            </th>
                                        </template>
                                    </tr>
                                </thead>

                                <tbody>
                                    <template for:each={paginatedData} for:item="row">
                                        <tr key={row.Id} data-id={row.Id}>
                                            <template for:each={columns} for:item="column">
                                                <td key={column.fieldName} class="dynamic-td" data-label={column.label}>
                                                    <c-table-cell record={row}
                                                        field-name={column.fieldName}
                                                        display-field={column.displayField}
                                                        is-url={column.isUrl}
                                                        is-boolean={column.isBoolean}
                                                        is-currency={column.isCurrency}
                                                        is-number={column.isNumber}
                                                        is-text={column.isText}
                                                        is-string={column.isString}
                                                        is-date={column.isDate}
                                                        currency-code={userCurrencyCode}
                                                        is-html-formula={column.isHtmlFormula}
                                                        is-text-formula={column.isTextFormula}
                                                        is-picklist={column.isPicklist}
                                                        is-multi-picklist={column.isMultiPicklist}
                                                        is-text-area={column.isTextArea}
                                                        record-id={row.Id}
                                                        onlinkclick={handleCellLinkClick}>
                                                    </c-table-cell>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <div class="dynamic-pagination">
                            <button class={prevPageClass} onclick={handlePrevious}>
                                Précédent
                            </button>

                            <template if:true={showFirstPageLink}>
                                <button onclick={handlePageClick} data-page="1" class="dynamic-page-btn">1</button>
                                <span class="dynamic-pagination-ellipsis">...</span>
                            </template>

                            <template for:each={visiblePages} for:item="page">
                                <button key={page.number} onclick={handlePageClick}
                                    data-page={page.number} class={page.cssClass}>
                                    {page.number}
                                </button>
                            </template>

                            <template if:true={showLastPageLink}>
                                <span class="dynamic-pagination-ellipsis">...</span>
                                <button onclick={handlePageClick} data-page={totalPages} class="dynamic-page-btn">
                                    {totalPages}
                                </button>
                            </template>

                            <button class={nextPageClass} onclick={handleNext}>
                                Suivant
                            </button>
                        </div>
                    </template>

                    <template if:false={filteredData.length}>
                        <div class="dynamic-empty">
                            <lightning-icon icon-name="utility:filterList" size="large" alternative-text="Aucune donnée"></lightning-icon>
                            <h3>Aucune donnée disponible</h3>
                            <p>
                                <template if:true={selectedListView}>
                                    Aucun enregistrement trouvé pour cette vue.
                                </template>
                                <template if:false={selectedListView}>
                                    Veuillez sélectionner une liste de vue pour afficher les données.
                                </template>
                            </p>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
