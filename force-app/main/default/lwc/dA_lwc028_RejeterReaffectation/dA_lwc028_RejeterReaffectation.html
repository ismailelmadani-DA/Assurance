<template>
   

    <!-- Modal -->
    <template lwc:if={isModalOpen}>
        <div class="fs-modal-overlay">
            <div class="fs-modal">

                <div class="fs-modal__header fs-modal__header--reject">
                    <div class="fs-modal__header-inner">
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <h2 class="fs-modal__title">Rejeter la réaffectation</h2>
                    </div>
                    <button class="fs-modal__close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="xx-small" variant="inverse"></lightning-icon>
                    </button>
                </div>

                <div class="fs-modal__body">

                    <!-- Bloc confirmation -->
                    <div class="fs-confirm-block">
                        <lightning-icon
                            icon-name="utility:warning"
                            size="medium"
                            variant="warning"
                            class="fs-confirm-icon">
                        </lightning-icon>
                        <p class="fs-confirm-text">
                            Êtes-vous sûr de vouloir rejeter cette réaffectation ?<br/>
                            La requête sera retournée au demandeur avec le statut
                            <strong>Rejetée</strong>.
                        </p>
                    </div>

                    <!-- Infos requête -->
                    <template lwc:if={requeteInfo}>
                        <div class="fs-info-card">
                            <div class="fs-info-row">
                                <span class="fs-info-label">Réaffecter à</span>
                                <span class="fs-info-value">{requeteInfo.reaffecterAName}</span>
                            </div>
                            <div class="fs-info-row">
                                <span class="fs-info-label">Déclaration</span>
                                <span class="fs-info-value">{requeteInfo.declarationNumber}</span>
                            </div>
                            <template lwc:if={requeteInfo.motif}>
                                <div class="fs-info-row">
                                    <span class="fs-info-label">Motif de réaffectation</span>
                                    <span class="fs-info-value fs-info-value--motif">{requeteInfo.motif}</span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Motif de rejet obligatoire -->
                    <div class="fs-section">
                        <div class="fs-section__title">
                            <span class="fs-section__num">1</span>
                            Motif de rejet
                        </div>
                        <div class="fs-section__content">
                            <lightning-textarea
                                label="Motif de rejet"
                                value={motifRejet}
                                onchange={handleMotifChange}
                                required
                                placeholder="Saisissez le motif de rejet...">
                            </lightning-textarea>
                        </div>
                    </div>

                </div>

                <div class="fs-modal__footer">
                    <button class="fs-btn fs-btn--cancel" onclick={handleCloseModal}>Annuler</button>
                    <button class="fs-btn fs-btn--reject-confirm" onclick={handleConfirm} disabled={isSaving}>
                        <template lwc:if={isSaving}>
                            <lightning-spinner alternative-text="Traitement" size="x-small" variant="inverse"></lightning-spinner>
                        </template>
                        Confirmer
                    </button>
                </div>

            </div>
        </div>
    </template>
</template>
