<template>
    <div class="fsd-container">
        <template if:true={hasFlags}>
            <div class="fsd-flags">
                <template for:each={flagBadges} for:item="badge">
                    <span key={badge.value} class={badge.class}>{badge.label}</span>
                </template>
            </div>
        </template>
    </div>
</template>
