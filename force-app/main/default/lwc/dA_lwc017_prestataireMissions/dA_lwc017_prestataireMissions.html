<template>
    <div class="pm-card">

        <!-- HEADER -->
        <div class="pm-header">
            <div class="pm-header__left">
                <div class="pm-header__icon-wrap">
                    <lightning-icon icon-name="standard:case" size="small" variant="inverse"></lightning-icon>
                </div>
                <div>
                    <h2 class="pm-header__title">Historique des missions</h2>
                    <span class="pm-header__subtitle">{totalLabel}</span>
                </div>
            </div>
        </div>

        <!-- SPINNER -->
        <template if:true={isLoading}>
            <div class="pm-spinner-overlay">
                <lightning-spinner alternative-text="Chargement..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- CONTENU -->
        <div class="pm-body">

            <!-- ERREUR -->
            <template if:true={hasError}>
                <div class="pm-alert pm-alert--error">
                    <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    <span>{errorMessage}</span>
                </div>
            </template>

            <!-- TABLE -->
            <template if:true={hasRecords}>
                <div class="pm-table-wrap">
                    <table class="pm-table">
                        <thead>
                            <tr>
                                <th class="pm-th">N&#176; Mission</th>
                                <th class="pm-th">Nature de la mission</th>
                                <th class="pm-th">Statut</th>
                                <th class="pm-th">Cr&#233;&#233; le</th>
                                <th class="pm-th">Cr&#233;&#233; par</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredRecords} for:item="rec">
                                <tr key={rec.id}>

                                    <!-- N° Mission cliquable -->
                                    <td class="pm-td pm-td--mono">
                                        <a class="pm-link"
                                            href="javascript:void(0)"
                                            data-id={rec.id}
                                            onclick={navigateToCase}>
                                            {rec.caseNumber}
                                        </a>
                                    </td>

                                    <!-- Nature de la mission -->
                                    <td class="pm-td">{rec.natureMission}</td>

                                    <!-- Statut avec badge -->
                                    <td class="pm-td">
                                        <span class={rec.statusClass}>{rec.status}</span>
                                    </td>

                                    <!-- Date de création -->
                                    <td class="pm-td">
                                        <lightning-formatted-date-time
                                            value={rec.createdDate}
                                            year="numeric"
                                            month="2-digit"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>

                                    <!-- Créé par cliquable -->
                                    <td class="pm-td pm-td--name">
                                        <template if:true={rec.hasCreatedBy}>
                                            <a class="pm-link"
                                                href="javascript:void(0)"
                                                data-id={rec.createdById}
                                                onclick={navigateToUser}>
                                                {rec.createdByName}
                                            </a>
                                        </template>
                                        <template if:false={rec.hasCreatedBy}>
                                            &#8212;
                                        </template>
                                    </td>

                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- PAGINATION -->
                <template if:true={showPagination}>
                    <div class="pm-pagination">
                        <button class="pm-btn pm-btn--page"
                            onclick={prevPage}
                            disabled={isFirstPage}>
                            <lightning-icon icon-name="utility:chevronleft" size="xx-small"></lightning-icon>
                            Pr&#233;c.
                        </button>
                        <span class="pm-page-info">Page {currentPage} / {totalPages}</span>
                        <button class="pm-btn pm-btn--page"
                            onclick={nextPage}
                            disabled={isLastPage}>
                            Suiv.
                            <lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                        </button>
                    </div>
                </template>
            </template>

            <!-- ÉTAT VIDE -->
            <template if:true={isEmpty}>
                <div class="pm-empty">
                    <div class="pm-empty__icon">
                        <lightning-icon icon-name="standard:case" size="large"></lightning-icon>
                    </div>
                    <p class="pm-empty__text">
                        Aucune mission n&#8217;est actuellement assign&#233;e &#224; ce prestataire.
                    </p>
                </div>
            </template>

        </div>
    </div>
</template>
