<template>
    <div class="instruction-coverages-wrapper">
        <!-- HEADER SECTION -->
        <div class="coverages-header">
            <h2 class="header-title">Instruction Coverages</h2>
            <span class="header-count" if:true={hasData}>{data.length}</span>
        </div>

        <!-- ERROR STATE -->
        <template if:true={error}>
            <div class="error-banner">
                <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{error}</span>
            </div>
        </template>

        <!-- LOADING STATE -->
        <template if:true={isLoading}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Chargement..." size="small"></lightning-spinner>
                <p>Chargement des données...</p>
            </div>
        </template>

        <!-- DATA STATE -->
        <template if:true={hasData}>
            <div class="table-wrapper">
                <table class="coverages-table">
                    <thead>
                        <tr class="table-header">
                            <th class="th-code">Code de la garantie</th>
                            <th class="th-name">Nom de la garantie</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={data} for:item="coverage">
                            <tr key={coverage.Id} class="coverage-row">
                                <td class="td-code">
                                    <div class="cell-content">
                                        <span class="code-badge">{coverage.CodeGarantie}</span>
                                    </div>
                                </td>
                                <td class="td-name">
                                    <div class="cell-content">
                                        <a 
                                            href="#" 
                                            class="name-link" 
                                            title={coverage.ClaimCoverageName}
                                            data-record-id={coverage.Id}
                                            onclick={handleNavigateToRecord}
                                        >
                                            {coverage.ClaimCoverageName}
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- EMPTY STATE -->
        <template if:false={hasData}>
            <template if:false={isLoading}>
                <div class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21H3a2 2 0 0 0-2-2V5a2 2 0 0 0 2-2h18a2 2 0 0 0 2 2v14a2 2 0 0 0-2 2z"></path>
                        <line x1="9" y1="5" x2="9" y2="7"></line>
                        <line x1="15" y1="5" x2="15" y2="7"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                    </svg>
                    <p class="empty-text">Aucune donnée disponible</p>
                </div>
            </template>
        </template>
    </div>
</template>
