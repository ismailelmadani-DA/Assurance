<template>

    <!-- CARTE PRINCIPALE -->
    <div class="pm-card">

        <!-- HEADER -->
        <div class="pm-header">
            <div class="pm-header__left">
                <div class="pm-header__icon-wrap">
                    <lightning-icon icon-name="standard:entitlement" size="small" variant="inverse"></lightning-icon>
                </div>
                <div>
                    <h2 class="pm-header__title">Garanties</h2>
                    <span class="pm-header__subtitle">{totalLabel}</span>
                </div>
            </div>
            <div class="pm-header__actions">
                <button class="pm-btn pm-btn--icon" onclick={handleRefresh} title="Actualiser">
                    <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                </button>
            </div>
        </div>

        <!-- CONTENU -->
        <div class="pm-body">

            <!-- ERREUR -->
            <template if:true={error}>
                <div class="pm-alert pm-alert--error" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    <span>{error}</span>
                </div>
            </template>

            <!-- TABLE -->
            <template if:true={hasCoverages}>
                <div class="pm-table-wrap">
                    <table class="pm-table" aria-label="Liste des garanties">
                        <thead>
                            <tr>
                                <th class="pm-th pm-th--center" scope="col">Garantie touch&eacute;e</th>
                                <th class="pm-th" scope="col">Code de la garantie</th>
                                <th class="pm-th" scope="col">Nom de la garantie</th>
                                <th class="pm-th" scope="col">Type de la garantie</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={coverages} for:item="cov">
                                <tr key={cov.Id} class={cov.rowClass}>
                                    <td class="pm-td pm-td--center">
                                        <input
                                            type="checkbox"
                                            checked={cov.isChecked}
                                            disabled={cov.isDisabled}
                                            data-id={cov.Id}
                                            onchange={handleCheckboxChange}
                                            class={cov.checkboxClass}
                                        />
                                    </td>
                                    <td class="pm-td pm-td--mono">{cov.CodeGarantie__c}</td>
                                    <td class="pm-td pm-td--name">{cov.NomDeLaGarantie__c}</td>
                                    <td class="pm-td">{cov.typeLabel}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- ETAT VIDE -->
            <template if:false={hasCoverages}>
                <template if:false={error}>
                    <div class="pm-empty">
                        <div class="pm-empty__icon">
                            <lightning-icon icon-name="standard:entitlement" size="large"></lightning-icon>
                        </div>
                        <p class="pm-empty__text">Il n'y a actuellement aucune garantie &agrave; afficher.</p>
                    </div>
                </template>
            </template>

        </div>

        <!-- FOOTER - Bouton Enregistrer -->
        <template if:true={hasChanges}>
            <div class="pm-footer">
                <button class="pm-btn pm-btn--save" onclick={handleSave} disabled={isSaving}>
                    <template if:true={isSaving}>
                        <lightning-spinner size="xx-small" variant="inverse" alternative-text="Enregistrement"></lightning-spinner>
                    </template>
                    <template if:false={isSaving}>
                        Enregistrer
                    </template>
                </button>
            </div>
        </template>

    </div>

</template>
