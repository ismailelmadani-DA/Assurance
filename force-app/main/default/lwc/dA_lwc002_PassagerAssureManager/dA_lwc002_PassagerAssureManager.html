<template>
    <!-- ══════════════════════════════════
         CARD PRINCIPALE
    ══════════════════════════════════ -->
    <div class="pm-card">

        <!-- ── Header ── -->
        <div class="pm-header">
            <div class="pm-header__left">
                <div class="pm-header__icon-wrap">
                    <lightning-icon icon-name="standard:people" size="small"></lightning-icon>
                </div>
                <div>
                    <p class="pm-header__title">{listTitle}</p>
                    <span class="pm-header__subtitle">{totalLabel}</span>
                </div>
            </div>

            <div class="pm-header__actions">

                <!-- Filtres rapides (si activés) -->
                <!-- <template if:true={showFilterPills}>
                    <div class="pm-filter-pills">
                        <button class={pillAllClass} onclick={filterAll}>Tous</button>
                        <button class={pillAssureClass} data-role="Passager assuré"
                            onclick={filterRole}>Assurés</button>
                        <button class={pillAdverseClass} data-role="Passager adverse"
                            onclick={filterRole}>Adverses</button>
                    </div>
                </template> -->

                <!-- Bouton Ajouter (si activé et non readonly) -->
                <template if:true={showAddButton}>
                    <template if:false={isReadonly}>
                        <button class="pm-btn pm-btn--add" onclick={handleAdd}>
                            <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                            Ajouter
                        </button>
                    </template>
                </template>

                <!-- Bouton Refresh -->
                <button class="pm-btn pm-btn--icon" onclick={handleRefresh} title="Actualiser">
                    <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                </button>
            </div>
        </div>

        <!-- ── Body ── -->
        <div class="pm-body">

            <!-- Spinner -->
            <template if:true={isLoading}>
                <div class="pm-spinner-overlay">
                    <lightning-spinner alternative-text="Chargement..." size="medium"
                        variant="brand"></lightning-spinner>
                </div>
            </template>

            <!-- Erreur globale -->
            <template if:true={hasError}>
                <div class="pm-alert pm-alert--error">
                    <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </template>

            <!-- Table -->
            <template if:true={hasRecords}>
                <div class="pm-table-wrap">
                    <table class="pm-table">
                        <thead>
                            <tr>
                                <template if:true={showColConducteur}>
                                    <th class="pm-th pm-th--center">Cond.</th>
                                </template>
                                <template if:true={showColCivilite}>
                                    <th class="pm-th">Civ.</th>
                                </template>
                                <template if:true={showColNom}>
                                    <th class="pm-th">Nom complet</th>
                                </template>
                                <template if:true={showColRole}>
                                    <th class="pm-th">Rôle</th>
                                </template>
                                <template if:true={showColCNI}>
                                    <th class="pm-th">CNI</th>
                                </template>
                                <template if:true={showColPays}>
                                    <th class="pm-th">Pays</th>
                                </template>
                                <template if:true={showColVille}>
                                    <th class="pm-th">Ville</th>
                                </template>
                                <template if:true={showColEtat}>
                                    <th class="pm-th">État</th>
                                </template>
                                <template if:true={showActionColumn}>
                                    <th class="pm-th pm-th--center">Actions</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredRecords} for:item="row">
                                <tr key={row.Id}>
                                    <template if:true={showColConducteur}>
                                        <td class="pm-td pm-td--center">
                                            <template if:true={row.isDriver__c}>
                                                <span class="pm-badge pm-badge--driver">
                                                    <lightning-icon icon-name="utility:check"
                                                        size="x-small"></lightning-icon>
                                                </span>
                                            </template>
                                            <template if:false={row.isDriver__c}>
                                                <span class="pm-badge pm-badge--no">—</span>
                                            </template>
                                        </td>
                                    </template>
                                    <template if:true={showColCivilite}>
                                        <td class="pm-td">{row.civility}</td>
                                    </template>
                                    <template if:true={showColNom}>
                                        <td class="pm-td pm-td--name">
                                            <a href={row.participantUrl} class="pm-link">{row.accountName}</a>
                                        </td>
                                    </template>
                                    <template if:true={showColRole}>
                                        <td class="pm-td">
                                            <span class={row.roleClass}>{row.Roles__c}</span>
                                        </td>
                                    </template>
                                    <template if:true={showColCNI}>
                                        <td class="pm-td pm-td--mono">{row.ParticipantCNI__c}</td>
                                    </template>
                                    <template if:true={showColPays}>
                                        <td class="pm-td">{row.Pays__c}</td>
                                    </template>
                                    <template if:true={showColVille}>
                                        <td class="pm-td">{row.Ville__c}</td>
                                    </template>
                                    <template if:true={showColEtat}>
                                        <td class="pm-td">
                                            <span class={row.stateClass}>{row.StateOfPerson__c}</span>
                                        </td>
                                    </template>
                                    <template if:true={showActionColumn}>
                                        <td class="pm-td pm-td--actions">
                                            <div class="pm-action-group">
                                                <template if:false={isReadonly}>
                                                    <button class="pm-action-btn pm-action-btn--edit" data-id={row.Id}
                                                        data-action="edit" onclick={handleRowAction} title="Modifier">
                                                        <lightning-icon icon-name="utility:edit"
                                                            size="x-small"></lightning-icon>
                                                    </button>
                                                    <button class="pm-action-btn pm-action-btn--delete" data-id={row.Id}
                                                        data-action="delete" onclick={handleRowAction}
                                                        title="Supprimer">
                                                        <lightning-icon icon-name="utility:delete"
                                                            size="x-small"></lightning-icon>
                                                    </button>
                                                </template>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <template if:true={showPagination}>
                    <div class="pm-pagination">
                        <button class={prevClass} onclick={prevPage} disabled={isFirstPage}>
                            <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
                        </button>
                        <span class="pm-page-info">Page {currentPage} / {totalPages}</span>
                        <button class={nextClass} onclick={nextPage} disabled={isLastPage}>
                            <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </template>
            </template>

            <!-- État vide -->
            <template if:false={hasRecords}>
                <template if:false={isLoading}>
                    <div class="pm-empty">
                        <div class="pm-empty__icon">
                            <lightning-icon icon-name="standard:people" size="large"></lightning-icon>
                        </div>
                        <p class="pm-empty__text">Aucun passager enregistré</p>
                        <template if:true={showAddButton}>
                            <template if:false={isReadonly}>
                                <button class="pm-btn pm-btn--outlined" onclick={handleAdd}>
                                    <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                                    Ajouter un passager
                                </button>
                            </template>
                        </template>
                    </div>
                </template>
            </template>

        </div>
    </div>

    <!-- ══════════════════════════════════
         MODALE FORMULAIRE AJOUT/ÉDITION
    ══════════════════════════════════ -->
    <template if:true={showFormModal}>
        <div class="pm-modal-overlay" onclick={handleOverlayClick}>
            <div class="pm-modal" onclick={stopPropagation}>

                <!-- Header modal -->
                <div class="pm-modal__header">
                    <div class="pm-modal__header-inner">
                        <lightning-icon icon-name="utility:user" size="small"></lightning-icon>
                        <h2 class="pm-modal__title">{modalTitle}</h2>
                    </div>
                    <button class="pm-modal__close" onclick={closeModal} title="Fermer">
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                    </button>
                </div>

                <!-- Body modal -->
                <div class="pm-modal__body">

                    <!-- Spinner formulaire -->
                    <template if:true={isFormLoading}>
                        <div class="pm-spinner-overlay">
                            <lightning-spinner alternative-text="Chargement..." size="medium"
                                variant="brand"></lightning-spinner>
                        </div>
                    </template>

                    <!-- ─── SECTION 1 : Identité ─── -->
                    <div class="pm-section">
                        <div class="pm-section__title">
                            <span class="pm-section__num">1</span>
                            Identité du participant
                        </div>
                        <div class="pm-grid">

                            <!-- Rôle -->
                            <!-- <div class="pm-field">
                                <lightning-combobox name="roles" label="Rôle *" value={form.roles}
                                    options={rolesOptions} onchange={handleFieldChange}
                                    placeholder="Sélectionner un rôle"
                                    field-level-help="Rôle du participant dans le sinistre">
                                </lightning-combobox>
                                <template if:true={errors.roles}>
                                    <p class="pm-error">{errors.roles}</p>
                                </template>
                            </div> -->

                            <!-- Civilité -->
                            <div class="pm-field">
                                <lightning-combobox name="civility" label="Civilité *" value={form.civility}
                                    options={civilityOptions} onchange={handleFieldChange} placeholder="Sélectionner">
                                </lightning-combobox>
                                <template if:true={errors.civility}>
                                    <p class="pm-error">{errors.civility}</p>
                                </template>
                            </div>

                            <!-- Nom -->
                            <div class="pm-field">
                                <lightning-input name="nom" label="Nom *" value={form.nom} onchange={handleFieldChange}
                                    placeholder="Nom de famille">
                                </lightning-input>
                                <template if:true={errors.nom}>
                                    <p class="pm-error">{errors.nom}</p>
                                </template>
                            </div>

                            <!-- Prénom -->
                            <div class="pm-field">
                                <lightning-input name="prenom" label="Prénom *" value={form.prenom}
                                    onchange={handleFieldChange} placeholder="Prénom">
                                </lightning-input>
                                <template if:true={errors.prenom}>
                                    <p class="pm-error">{errors.prenom}</p>
                                </template>
                            </div>

                            <!-- CNI -->
                            <div class="pm-field">
                                <lightning-input name="cni" label="CNI *" value={form.cni} onchange={handleFieldChange}
                                    placeholder="Numéro CNI">
                                </lightning-input>
                                <template if:true={errors.cni}>
                                    <p class="pm-error">{errors.cni}</p>
                                </template>
                            </div>

                            <!-- Date de naissance -->
                            <div class="pm-field">
                                <lightning-input type="date" name="dateNaissance" label="Date de naissance"
                                    value={form.dateNaissance} onchange={handleFieldChange}>
                                </lightning-input>
                            </div>

                            <!-- Sexe (depuis ClaimParticipant__c) -->
                            <div class="pm-field">
                                <lightning-combobox name="sexe" label="Sexe" value={form.sexe} options={sexeOptions}
                                    onchange={handleFieldChange} placeholder="Sélectionner">
                                </lightning-combobox>
                            </div>

                            <!-- Situation familiale (depuis ClaimParticipant__c) -->
                            <div class="pm-field">
                                <lightning-combobox name="situationFamiliale" label="Situation familiale"
                                    value={form.situationFamiliale} options={situationFamilialeOptions}
                                    onchange={handleFieldChange} placeholder="Sélectionner">
                                </lightning-combobox>
                            </div>

                        </div>
                    </div>

                    <!-- ─── SECTION 2 : Coordonnées ─── -->
                    <div class="pm-section">
                        <div class="pm-section__title">
                            <span class="pm-section__num">2</span>
                            Coordonnées &amp; Localisation
                        </div>
                        <div class="pm-grid">

                            <!-- Pays (depuis ClaimParticipant__c — picklist globale "Pays") -->
                            <div class="pm-field">
                                <lightning-combobox name="pays" label="Pays *" value={form.pays} options={paysOptions}
                                    onchange={handleFieldChange} placeholder="Sélectionner un pays">
                                </lightning-combobox>
                                <template if:true={errors.pays}>
                                    <p class="pm-error">{errors.pays}</p>
                                </template>
                            </div>

                            <!-- Ville (dépendante du pays — picklist globale "Ville") -->
                            <div class="pm-field">
                                <lightning-combobox name="ville" label="Ville *" value={form.ville}
                                    options={filteredVilleOptions} onchange={handleFieldChange}
                                    placeholder="Sélectionner une ville" disabled={isVilleDisabled}>
                                </lightning-combobox>
                                <template if:true={errors.ville}>
                                    <p class="pm-error">{errors.ville}</p>
                                </template>
                            </div>

                            <!-- Adresse -->
                            <div class="pm-field pm-field--full">
                                <lightning-input name="adresse" label="Adresse" value={form.adresse}
                                    onchange={handleFieldChange} placeholder="Adresse complète">
                                </lightning-input>
                            </div>

                            <!-- Type contact -->
                            <div class="pm-field">
                                <lightning-combobox name="typeContact" label="Type de contact" value={form.typeContact}
                                    options={typeContactOptions} onchange={handleFieldChange}
                                    placeholder="Sélectionner">
                                </lightning-combobox>
                            </div>

                            <!-- Téléphone -->
                            <div class="pm-field">
                                <lightning-input type="tel" name="telephone" label="Téléphone" value={form.telephone}
                                    onchange={handleFieldChange} placeholder="+212 6XX XXX XXX">
                                </lightning-input>
                                <template if:true={errors.telephone}>
                                    <p class="pm-error">{errors.telephone}</p>
                                </template>
                            </div>

                            <!-- Email -->
                            <div class="pm-field">
                                <lightning-input type="email" name="email" label="Email" value={form.email}
                                    onchange={handleFieldChange} placeholder="email@exemple.com">
                                </lightning-input>
                                <template if:true={errors.email}>
                                    <p class="pm-error">{errors.email}</p>
                                </template>
                            </div>

                        </div>
                    </div>

                    <!-- ─── SECTION 3 : État & Sinistre ─── -->
                    <div class="pm-section">
                        <div class="pm-section__title">
                            <span class="pm-section__num">3</span>
                            État &amp; Informations sinistre
                        </div>
                        <div class="pm-grid">

                            <!-- État du passager (depuis ClaimParticipant__c) -->
                            <div class="pm-field">
                                <lightning-combobox name="etatPassager" label="État du participant *"
                                    value={form.etatPassager} options={etatPassagerOptions} onchange={handleFieldChange}
                                    placeholder="Indemne / Blessé / Décédé">
                                </lightning-combobox>
                                <template if:true={errors.etatPassager}>
                                    <p class="pm-error">{errors.etatPassager}</p>
                                </template>
                            </div>

                            <!-- Revenu annuel -->
                            <div class="pm-field">
                                <lightning-input type="number" name="revenuAnnuel" label="Revenu annuel (MAD)"
                                    value={form.revenuAnnuel} onchange={handleFieldChange} step="any">
                                </lightning-input>
                            </div>

                            <!-- ITT (si Blessé) -->
                            <template if:true={showIttIpp}>
                                <div class="pm-field">
                                    <lightning-input type="number" name="itt" label="ITT (jours)" value={form.itt}
                                        onchange={handleFieldChange} min="0">
                                    </lightning-input>
                                </div>
                                <div class="pm-field">
                                    <lightning-input type="number" name="ipp" label="IPP (%)" value={form.ipp}
                                        onchange={handleFieldChange} min="0" max="100" step="0.01">
                                    </lightning-input>
                                </div>
                            </template>

                            <!-- Champs décès (si Décédé) -->
                            <template if:true={showDecesFields}>
                                <div class="pm-field">
                                    <lightning-input type="date" name="dateDeces" label="Date de décès"
                                        value={form.dateDeces} onchange={handleFieldChange}>
                                    </lightning-input>
                                </div>
                            </template>

                            <!-- Compagnie adverse (si rôle adverse) -->
                            <template if:true={isAdverse}>
                                <div class="pm-field">
                                    <lightning-combobox name="compagnieAdverse" label="Compagnie adverse"
                                        value={form.compagnieAdverse} options={compagniesAdversesOptions}
                                        onchange={handleFieldChange} placeholder="Sélectionner une compagnie adverse">
                                    </lightning-combobox>
                                </div>

                                <!-- Véhicule (si rôle adverse) -->
                                <div class="pm-field">
                                    <lightning-combobox name="vehiculeId" label="Véhicule *" value={form.vehiculeId}
                                        options={vehiculesOptions} onchange={handleFieldChange}
                                        placeholder="Sélectionner un véhicule (numéro d'immatriculation)">
                                    </lightning-combobox>
                                </div>
                            </template>

                        </div>

                        <!-- Toggle conducteur -->
                        <div style="padding: 0 1.1rem 1.1rem;">
                            <div class="pm-toggle-row">
                                <span class="pm-toggle-label">
                                    <lightning-icon icon-name="utility:car" size="x-small"></lightning-icon>
                                    Participant conducteur du véhicule
                                </span>
                                <lightning-input type="checkbox" name="conducteur" label="" checked={form.conducteur}
                                    onchange={handleCheckbox} disabled={isDriverDisabled}>
                                </lightning-input>
                            </div>
                        </div>

                    </div>

                </div>

                <!-- Footer modal -->
                <div class="pm-modal__footer">
                    <button class="pm-btn pm-btn--cancel" onclick={closeModal} disabled={isSaving}>
                        Annuler
                    </button>
                    <button class="pm-btn pm-btn--save" onclick={handleSave} disabled={isSaving}>
                        <template if:true={isSaving}>
                            <lightning-spinner size="x-small" variant="inverse"
                                alternative-text="Enregistrement..."></lightning-spinner>
                        </template>
                        <template if:false={isSaving}>
                            <lightning-icon icon-name="utility:save" size="x-small"></lightning-icon>
                        </template>
                        {saveLabel}
                    </button>
                </div>

            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════
         MODALE CONFIRMATION SUPPRESSION
    ══════════════════════════════════ -->
    <template if:true={showDeleteModal}>
        <div class="pm-modal-overlay">
            <div class="pm-modal pm-modal--small">

                <div class="pm-modal__header pm-modal__header--danger">
                    <div class="pm-modal__header-inner">
                        <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                        <h2 class="pm-modal__title">Confirmer la suppression</h2>
                    </div>
                    <button class="pm-modal__close" onclick={closeDeleteModal} title="Fermer">
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                    </button>
                </div>

                <div class="pm-modal__body pm-modal__body--confirm">
                    <p>Vous êtes sur le point de supprimer le passager :</p>
                    <p><strong>{selectedParticipantName}</strong></p>
                    <p class="pm-confirm__note">Cette action est irréversible.</p>
                </div>

                <div class="pm-modal__footer">
                    <button class="pm-btn pm-btn--cancel" onclick={closeDeleteModal} disabled={isSaving}>
                        Annuler
                    </button>
                    <button class="pm-btn pm-btn--danger" onclick={confirmDelete} disabled={isSaving}>
                        <template if:true={isSaving}>
                            <lightning-spinner size="x-small" variant="inverse"
                                alternative-text="Suppression..."></lightning-spinner>
                        </template>
                        <template if:false={isSaving}>
                            <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                        </template>
                        Supprimer
                    </button>
                </div>

            </div>
        </div>
    </template>

</template>
